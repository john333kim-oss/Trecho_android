name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: trecho-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # 폰 브라우저에서 로그인 없이 바로 받을 수 있게 Release에도 올린다
      # 항상 같은 주소: https://github.com/<owner>/<repo>/releases/latest/download/RunKKRun.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VER}-b${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk RunKKRun.apk
          gh release create "$TAG" RunKKRun.apk --title "RunKKRun ${VER} (build ${{ github.run_number }})" \
            --notes "Commit ${{ github.sha }}" --target "${{ github.sha }}" --latest
